<text class="nt" x="492" y="566">1. ALL SIZES IN MM. OVERALL 150 W X</text>
<text class="nt" x="492" y="582">104 H X 132 D.</text>
<text class="nt" x="492" y="604">2. HERO: STEEL SPREAD ROLLERS (1-4).</text>
<text class="nt" x="492" y="620">THEY BURST THE REAGENT POD AND SPREAD</text>
<text class="nt" x="492" y="636">IT AS THE PRINT EXITS.</text>
<text class="nt" x="492" y="658">3. PRINT EXITS A 4 MM SLOT BETWEEN</text>
<text class="nt" x="492" y="674">FACEPLATE AND FILM DOOR, AT THE</text>
<text class="nt" x="492" y="690">ROLLER NIP.</text>
<text class="nt" x="492" y="712">4. PRINT 88 X 107 IS THE REAL</text>
<text class="nt" x="492" y="728">600-FILM SIZE. BODY SIZES ARE</text>
<text class="nt" x="492" y="744">TYPICAL, NOT MEASURED.</text>
<text class="nt" x="492" y="766">5. BACK SLOPES ABOUT 45 DEG OVER THE</text>
<text class="nt" x="492" y="782">MIRROR; DRAWN AS TWO STEPS.</text>
<text class="nt" x="492" y="804">6. FILM DOOR HINGES DOWN TO LOAD THE</text>
<text class="nt" x="492" y="820">PACK; THE PACK HOLDS THE BATTERY.</text>
